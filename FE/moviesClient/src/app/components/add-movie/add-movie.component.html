

<div class="container">
    <div class="icon" style="color:red;" (click)="close();">
        <mat-icon>
            close
        </mat-icon>
    </div>
    <div class="title">
        <div class="movie">
            <mat-form-field>
                <mat-label>Title</mat-label>
                <input type="text" matInput 
                [formControl]="$any(getCreateMovieForm()).get('title')"
                />
            </mat-form-field>
            <mat-form-field>
                <mat-label>Trailer Link</mat-label>
                <input type="text" matInput 
                [formControl]="$any(getCreateMovieForm()).get('trailerLink')"
                >
            </mat-form-field>
            <mat-form-field>
                <mat-label>Description</mat-label>
                <textarea type="text" matInput 
                [formControl]="$any(getCreateMovieForm()).get('description')"
                >
                </textarea>
            </mat-form-field>
            <mat-form-field>
                <mat-label>Languages </mat-label>
                <mat-select >
                    <mat-option 
                    (onSelectionChange)="changeLanguage($event)"
                    *ngFor="let language of getLanguagesKeys()" [value]="language">
                      {{language}}
                    </mat-option>
                </mat-select>
            </mat-form-field>
            <mat-form-field>
                <mat-label>Subtitle</mat-label>
                <mat-select >
                    <mat-option 
                    (onSelectionChange)="changeSubtitle($event)"
                    *ngFor="let language of getLanguagesKeys()" [value]="language">
                      {{language}}
                    </mat-option>
                </mat-select>
            </mat-form-field>
            <div class="fileInput">
                <mat-label>Movie:</mat-label>
                <input type="file" (change)="onFileSelected($event)">
            </div>
            <div class="fileInput">
                <mat-label>Movie poster</mat-label>
                <input type="file" (change)="onFilePosterSelected($event)">
            </div>
            <mat-form-field>
                <mat-label>Added date for the movie</mat-label>
                <input type="date"  matInput [formControl]="$any(getCreateMovieForm()).get('addedDate')">
            </mat-form-field>
            <mat-form-field>
                <mat-label>Movie release date</mat-label>
                <input type="number" min="1990" max="getCurrentYear()" step="1" value="2016"
                
                matInput [formControl]="$any(getCreateMovieForm()).get('movieReleaseDate')">
            </mat-form-field>
            <mat-form-field>
                <mat-label>
                    Categories 
                </mat-label>
                <mat-select [formControl]="$any(getCreateMovieForm()).get('categories')" multiple>
                    <mat-option *ngFor="let category of categories" [value]="category.Id">
                        {{category.Name}}
                    </mat-option>
                </mat-select>   
            </mat-form-field>
            
            
        </div>
        <button class="btn" 
        [disabled]="!isFileUploaded()"
        mat-raised-button color="accent" (click)="addMovieToVidGuard()">
            Create Movie
        </button>
    </div>
</div>
